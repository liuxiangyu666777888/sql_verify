server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sql_exam}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  judge:
    host: ${JUDGE_DB_HOST:${DB_HOST:localhost}}
    port: ${JUDGE_DB_PORT:${DB_PORT:3306}}
    username: ${JUDGE_DB_USERNAME:${DB_USERNAME:root}}
    password: ${JUDGE_DB_PASSWORD:${DB_PASSWORD:password}}
    timeout-seconds: ${JUDGE_QUERY_TIMEOUT_SECONDS:5}
    max-rows: ${JUDGE_MAX_ROWS:1000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
